name: Update Playwright Snapshots

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Branch to refresh snapshots for and target with the pull request
        required: true
        default: develop
        type: string

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      snapshot-branch: ${{ steps.branch.outputs.name }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_branch }}
          persist-credentials: false

      - name: Create snapshot update branch
        id: branch
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          branch="update-playwright-snapshots-${RUN_ID}-${RUN_ATTEMPT}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/iron
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Update and verify snapshots
        env:
            VITE_ASSETS_SITE_URL: ${{ secrets.VITE_ASSETS_SITE_URL }}
        shell: bash
        run: |
          verified=false
          for iteration in 1 2 3; do
            echo "Snapshot update and verification attempt $iteration of 3"
            update_succeeded=false
            if npm run test:e2e:update-snapshots; then
              update_succeeded=true
            else
              echo "Snapshot update command failed."
            fi

            if npm run test:e2e; then
              if [[ "$update_succeeded" == true ]]; then
                verified=true
                break
              fi
            else
              echo "E2E verification failed."
            fi
          done

          if [[ "$verified" != true ]]; then
            echo "Failed to update snapshots and pass all E2E tests after 3 attempts."
            exit 1
          fi

      - name: Upload updated snapshots
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: playwright-snapshots
          path: tests/e2e/__snapshots__/
          if-no-files-found: error
          retention-days: 1

  publish-snapshots:
    needs: update-snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_branch }}

      - name: Download updated snapshots
        uses: actions/download-artifact@v7
        with:
          name: playwright-snapshots
          path: tests/e2e/__snapshots__/

      - name: Push snapshots and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          SNAPSHOT_BRANCH: ${{ needs.update-snapshots.outputs.snapshot-branch }}
        run: |
          git switch --create "$SNAPSHOT_BRANCH"
          git add tests/e2e/__snapshots__
          if git diff --cached --quiet; then
            echo "No snapshot changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Playwright snapshots"
          git push --set-upstream origin "$SNAPSHOT_BRANCH"

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$SNAPSHOT_BRANCH" \
            --title "Update Playwright snapshots" \
            --body "Automated Playwright screenshot snapshot refresh. All E2E tests passed after the snapshot update."

  cleanup-snapshot-artifact:
    needs: [update-snapshots, publish-snapshots]
    if: ${{ always() && needs.update-snapshots.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete snapshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.update-snapshots.outputs.artifact-id }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"